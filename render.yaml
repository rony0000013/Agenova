services:
  - type: web
    name: agenova-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_NAME
        value: "Agenova API"
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: STELLAR_NETWORK
        value: "testnet"
      - key: STELLAR_HORIZON_URL
        value: "https://horizon-testnet.stellar.org"
      - key: STELLAR_RPC_URL
        value: "https://soroban-testnet.stellar.org"
      - key: PLATFORM_TREASURY_ADDRESS
        value: "GCKKLWVLYIMKSCR5LJHIFAHFWZMA23LN47KQ24JJ5TBG4IPCNND2TO37"
      - key: PLATFORM_TREASURY_SECRET
        value: "SD4VLP4OSB3DXY4AYCHT3FUJ75CZSO4FZN25N45RUEHAAVXZPBVOI2TR"
      - key: AGENT_REGISTRY_ID
        value: "CAY55BKRJWKLH3UGHJ23FAOMVF5OBA66DWDCLDG4ZXJDMNDLIBAJ2MN5"
      - key: REVENUE_SHARING_ID
        value: "CAY55BKRJWKLH3UGHJ23FAOMVF5OBA66DWDCLDG4ZXJDMNDLIBAJ2MN5"
      - key: SERVICE_AGREEMENT_ID
        value: "CAY55BKRJWKLH3UGHJ23FAOMVF5OBA66DWDCLDG4ZXJDMNDLIBAJ2MN5"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./agenova.db"
